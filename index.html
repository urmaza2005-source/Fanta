<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Bryan Leoben S. Urmaza | BSIT Portfolio</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0;
    }
    
    body {
      min-height: 100vh;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .page {
      width: 100%;
      max-width: 480px;
      padding: 40px 30px;
      text-align: center;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
    }

    .avatar {
      width: 110px;
      height: 110px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 800;
      color: #ffffff;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
      border: 4px solid #1e293b;
      letter-spacing: -1px;
    }

    h1 { 
      font-size: 24px; 
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 5px;
    }

    .subtitle { 
      color: #94a3b8; 
      font-size: 15px; 
      font-weight: 500;
      margin-bottom: 30px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .links { 
      display: grid; 
      gap: 16px; 
    }

    .links a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      color: #e2e8f0;
      background: rgba(255, 255, 255, 0.05);
      padding: 16px 20px;
      border-radius: 12px;
      font-weight: 500;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }

    .links a:hover { 
      background: rgba(255, 255, 255, 0.1);
      border-color: #3b82f6;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -10px rgba(59, 130, 246, 0.3);
    }

    .links a:active { 
      transform: translateY(0); 
    }

    footer { 
      margin-top: 35px; 
      color: #64748b; 
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <main class="page">

    <h1>Bryan Leoben S. Urmaza</h1>

      <a href="mailto:urmaza2005@gmail.com">✉️ Email</a>
    </div>

    <footer>Tap • Connect • Follow</footer>
  </main>
</body>
</html>
